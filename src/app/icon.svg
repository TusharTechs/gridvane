<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#6EE7B7" />
      <stop offset="65%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#040814" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hexOuter" x1="20" y1="10" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bladeCyan" x1="50" y1="20" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="bladeEmerald" x1="30" y1="40" x2="160" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bladeAmber" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Deep Space Obsidian Background -->
  <rect width="200" height="200" rx="44" fill="#040814" />

  <!-- Post-Quantum Hexagonal Lattice Outer Truss -->
  <polygon
    points="100,12 176,56 176,144 100,188 24,144 24,56"
    fill="#071124"
    stroke="url(#hexOuter)"
    stroke-width="3.5"
  />
  <!-- Lattice Corner Truss Struts -->
  <line x1="100" y1="12" x2="100" y2="28" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.7" />
  <line x1="176" y1="56" x2="162" y2="64" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.7" />
  <line x1="176" y1="144" x2="162" y2="136" stroke="#10B981" stroke-width="1.8" stroke-opacity="0.7" />
  <line x1="100" y1="188" x2="100" y2="172" stroke="#10B981" stroke-width="1.8" stroke-opacity="0.7" />
  <line x1="24" y1="144" x2="38" y2="136" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.7" />
  <line x1="24" y1="56" x2="38" y2="64" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.7" />

  <!-- Outer Containment Ring -->
  <circle cx="100" cy="100" r="72" fill="#050C1A" stroke="url(#hexOuter)" stroke-width="4" />
  <circle cx="100" cy="100" r="64" fill="none" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="6 4" />

  <!-- Three Spiraling Aerodynamic Vane Blades -->
  <!-- Vane 1 (Top-Right Spiraling Blade) -->
  <path
    d="M96 28 C134 38 152 78 128 112 C134 84 118 58 92 52 Z"
    fill="url(#bladeCyan)"
  />
  <path
    d="M92 52 C118 58 130 84 114 108"
    fill="none"
    stroke="url(#bladeAmber)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Vane 2 (Bottom-Right Spiraling Blade) -->
  <path
    d="M164 134 C136 164 92 162 72 124 C94 142 124 138 140 116 Z"
    fill="url(#bladeCyan)"
  />
  <path
    d="M140 116 C124 138 94 140 80 114"
    fill="none"
    stroke="url(#bladeAmber)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Vane 3 (Left Spiraling Blade) -->
  <path
    d="M42 138 C28 100 48 60 88 62 C62 74 52 102 64 128 Z"
    fill="url(#bladeCyan)"
  />
  <path
    d="M64 128 C54 102 64 76 92 74"
    fill="none"
    stroke="url(#bladeAmber)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Inner Emerald Carbon Vortex Swirls -->
  <path
    d="M100 66 C120 68 132 86 122 106 C118 90 108 80 94 80 Z"
    fill="url(#bladeEmerald)"
  />
  <path
    d="M128 118 C116 136 94 138 80 120 C94 126 110 122 116 108 Z"
    fill="url(#bladeEmerald)"
  />
  <path
    d="M70 114 C62 96 72 76 94 74 C80 84 76 100 84 112 Z"
    fill="url(#bladeEmerald)"
  />

  <!-- Central Kirchhoff Phasor Singularity Core & Star Flare -->
  <circle cx="100" cy="100" r="28" fill="url(#coreGlow)" />
  <circle cx="100" cy="100" r="14" fill="#061426" stroke="#34D399" stroke-width="2.5" />
  <circle cx="100" cy="100" r="6.5" fill="#FFFFFF" />
  <!-- Crosshair Phasor Star Rays -->
  <line x1="66" y1="100" x2="134" y2="100" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />
  <line x1="100" y1="66" x2="100" y2="134" stroke="#A7F3D0" stroke-width="1.8" stroke-linecap="round" />
</svg>
